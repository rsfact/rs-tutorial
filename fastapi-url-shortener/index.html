<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
  <style>
    :root {
      --color-bg: #f5f5f5;
      --color-primary: #2563eb;
      --color-accent: #10b981;
    }
    body {
      font-family: sans-serif;
      background: var(--color-bg);
      padding: 40px 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { color: var(--color-primary); margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; }
    button { width: 100%; padding: 8px; background: var(--color-primary); color: white; border: none; cursor: pointer; }
    button:disabled { background: #999; }
    .result, .error { margin-top: 20px; padding: 12px; display: none; }
    .result { background: #f0fdf4; border: 1px solid var(--color-accent); }
    .result-url { color: var(--color-accent); margin-top: 8px; word-break: break-all; }
    .error { background: #fee; border: 1px solid #f00; color: #c00; }
    .show { display: block; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <form id="form">
    <div class="form-group">
      <label>短縮URL名</label>
      <input type="text" id="from_name" placeholder="premierleague" required>
    </div>
    <div class="form-group">
      <label>リダイレクト先URL</label>
      <input type="url" id="to_url" placeholder="https://www.premierleague.com/en" required>
    </div>
    <button type="submit">短縮URLを作成</button>
  </form>
  <div class="result" id="result">
    <strong>短縮URLが作成されました！</strong>
    <div class="result-url" id="resultUrl"></div>
  </div>
  <div class="error" id="error"></div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const result = document.getElementById('result');
      const error = document.getElementById('error');
      btn.disabled = true;
      result.classList.remove('show');
      error.classList.remove('show');
      try {
        const res = await fetch('http://localhost:8000/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            from_name: document.getElementById('from_name').value,
            to_url: document.getElementById('to_url').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
        document.getElementById('resultUrl').textContent = `${window.location.origin}/u/${data.from_name}`;
        result.classList.add('show');
      } catch (err) {
        error.textContent = err.message;
        error.classList.add('show');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
